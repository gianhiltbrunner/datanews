name: Validate sources

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feeds
        id: check
        continue-on-error: true
        run: python scripts/validate_sources.py --report report.md

      - name: Open issue for dead feeds
        if: ${{ steps.check.outcome == 'failure' && hashFiles('report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "Dead feeds found in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Dead feeds found" --body-file report.md
          fi
