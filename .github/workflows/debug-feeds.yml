name: Debug feed access (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Substack workarounds
        run: |
          ua="Mozilla/5.0 (compatible; datanews-bot/1.0; +https://github.com/)"
          probe() { printf "  %s  %s\n" "$(curl -s -o /tmp/body -m 25 -A "$ua" -w "%{http_code} %{size_download}B" "$@")" "${@: -1}"; head -c 160 /tmp/body | tr '\n' ' '; echo; }
          echo "== direct IPv6"
          probe -6 "https://benn.substack.com/feed"
          echo "== substack.com URL variants"
          probe "https://substack.com/@benn/feed"
          probe "https://benn.substack.com/feed.xml"
          probe "https://benn.substack.com/api/v1/archive?sort=new&limit=5"
          echo "== proxies"
          probe "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fbenn.substack.com%2Ffeed"
          probe "https://r.jina.ai/https://benn.substack.com/feed"
          probe "https://rsshub.app/substack/benn"
          probe "https://openrss.org/benn.substack.com"
          probe "https://feedproxy.feedly.com/https://benn.substack.com/feed"
